<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>CASA CLUB — La casa è una squadra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --paper: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #10b981;
  --primary-light: #ecfdf5;
  --primary-dark: #047857;
  --accent: #6366f1;
  --accent-light: #eef2ff;
  --gold: #f59e0b;
  --gold-light: #fef3c7;
  --red: #ef4444;
  --red-light: #fef2f2;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.03);
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 20px 30px -10px rgba(15, 23, 42, 0.12);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }
button { cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: none; }
button:active { transform: scale(0.97); }

main {
  max-width: 680px;
  margin: auto;
  padding: 20px 20px calc(110px + env(safe-area-inset-bottom));
}

/* Header & Brand */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 10px 0 24px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.mark {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 22px;
  box-shadow: 0 8px 16px -4px rgba(16, 185, 129, 0.4);
}
.brand strong { display: block; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); }
.brand small { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; }

.btn-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: var(--shadow-sm);
}

/* Typography & Layout */
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
  margin: 0 0 6px;
}
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 6px; color: var(--ink); }
h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 28px 0 14px; }
h3 { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13.5px; font-weight: 500; }

/* Cards & Elements */
.card {
  background: var(--paper);
  border: 1px solid rgba(226, 232, 240, 0.8);
  border-radius: var(--radius);
  padding: 20px;
  margin: 14px 0;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card-featured {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  border: none;
}
.card-featured .eyebrow, .card-featured .sub { color: #94a3b8; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Profile Bar */
.profiles { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 16px; scrollbar-width: none; }
.profiles::-webkit-scrollbar { display: none; }
.profile {
  border: 1.5px solid var(--line);
  background: var(--paper);
  border-radius: 99px;
  padding: 8px 16px;
  white-space: nowrap;
  color: var(--ink);
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}
.profile.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
}

/* Navigation Bar */
nav {
  position: fixed;
  z-index: 10;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 520px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 24px;
  padding: 6px;
  display: flex;
  justify-content: space-between;
  gap: 4px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0, 0, 0, 0.05);
}
nav button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 18px;
  padding: 8px 2px;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
nav button span { font-size: 18px; }
nav button.active {
  background: var(--ink);
  color: #fff;
}

/* Buttons */
.btn {
  border: 0;
  background: var(--ink);
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-weight: 700;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn.secondary { background: var(--accent-light); color: var(--accent); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--red-light); color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.big { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.pill {
  display: inline-flex;
  align-items: center;
  background: var(--primary-light);
  color: var(--primary-dark);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.progress {
  height: 10px;
  border-radius: 99px;
  background: #e2e8f0;
  overflow: hidden;
  margin: 12px 0;
}
.progress > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #10b981, #34d399);
  border-radius: 99px;
  transition: width 0.4s ease;
}

/* Task Card */
.task {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin: 8px 0;
  text-align: left;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.task:hover { border-color: var(--primary); }
.task b { font-weight: 700; font-size: 15px; }
.task small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.task .pts { color: var(--primary); font-weight: 800; font-size: 14px; white-space: nowrap; }

/* Inputs */
input, select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--primary); }
label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.fieldrow { display: grid; grid-template-columns: 1fr 100px; gap: 10px; }

.listrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.listrow:last-child { border: 0; }

.notice {
  background: var(--gold-light);
  border: 1px solid #fde68a;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  color: #92400e;
  font-size: 13px;
  font-weight: 500;
  margin: 14px 0;
}

.empty { padding: 32px 16px; text-align: center; color: var(--muted); font-weight: 500; }
.rank { font-weight: 800; font-size: 22px; color: var(--gold); width: 28px; text-align: center; }
.avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--accent-light); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 18px; }

/* Modal & Toast */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 20;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.sheet {
  width: min(100%, 540px);
  background: var(--paper);
  border-radius: 28px;
  padding: 24px;
  max-height: 85dvh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(95px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  border-radius: 99px;
  padding: 12px 22px;
  font-weight: 600;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0, 0, 0.2, 1);
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

@media(min-width: 650px) {
  main { padding-top: 40px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 .card { margin: 0; }
  .modal { align-items: center; }
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <div class="mark">C</div>
    <div><strong>CASA CLUB</strong><small>OGNI GESTO CONTA</small></div>
  </div>
  <button class="btn-icon" id="settingsShortcut" aria-label="Impostazioni">⚙</button>
</header>
<div id="app"></div>
</main>

<nav id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='casa_club_local_v1', OLD='faccende_v1';
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monday=t=>{let d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return +d};
const fmt=t=>new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const ADULT=[
['Cucina',[['Cucinare pranzo o cena',15],['Apparecchiare e sparecchiare',4],['Lavare i piatti',6],['Caricare o svuotare la lavastoviglie',4],['Pulire il piano cottura',8],['Pulire il frigorifero',15],['Pulire il forno',20]]],
['Bucato',[['Fare lavatrice e stendere',7],['Ritirare e piegare i panni',7],['Stirare',12],['Cambiare le lenzuola',10]]],
['Pulizie',[['Passare l’aspirapolvere',10],['Lavare i pavimenti',15],['Pulire il bagno',18],['Spolverare',8],['Pulire i vetri',15],['Fare i letti',3],['Riordinare gli ambienti',5],['Pulire il balcone',12]]],
['Altro',[['Fare la spesa',12],['Portare fuori la spazzatura',3],['Svuotare i cestini',2],['Annaffiare le piante',2]]]
];
const CHILD=[['Camera e ordine',[['Riordinare i giochi',5],['Sistemare il letto',3],['Mettere a posto scarpe e giacca',3],['Preparare lo zaino',5],['Piegare i propri vestiti',5]]],['Aiuto in famiglia',[['Apparecchiare la tavola',4],['Aiutare a sparecchiare',4],['Aiutare in cucina con un adulto',5],['Dare da mangiare all’animale (se previsto)',3]]]];
const ADULT_REWARDS=[['Scegliere il film della serata',30],['Colazione a letto',50],['Massaggio di 20 minuti',60],['Una giornata senza faccende',120],['Cena fuori scelta da me',180],['Regalo a sorpresa',350]];
const CHILD_REWARDS=[['30 minuti di gioco extra',30],['Scegliere il film',40],['Paghetta da 5 €',50],['Uscita speciale',100],['Esperienza speciale',300],['Nuovo videogame',400]];

function defaults(){return {version:2,people:[{id:'p1',name:'Adulto 1',type:'adult',age:35},{id:'p2',name:'Adulto 2',type:'adult',age:35},{id:'c1',name:'Figlio 1',type:'child',age:8}],current:'p1',tasks:[...ADULT.flatMap(([g,a])=>a.map(([name,points])=>({id:uid(),group:g,name,points,for:'adult'}))),...CHILD.flatMap(([g,a])=>a.map(([name,points])=>({id:uid(),group:g,name,points,for:'child'})))],pending:[],approved:[],rejected:[],redeems:[],rewards:[...ADULT_REWARDS.map(([name,cost])=>({id:uid(),name,cost,for:'adult'})),...CHILD_REWARDS.map(([name,cost])=>({id:uid(),name,cost,for:'child'}))],team:{goal:250,week:monday(Date.now()),prize:'Serata in famiglia scelta da tutti'},weeks:[],settings:{weeklyBonus:20,maxRedeems:2,childTargets:{small:25,medium:40,teen:55},theme:'light'},events:[],settledWeeks:[]};}
function migrateOld(o){const d=defaults();if(!o)return d;try{d.people=(o.players||d.people).map((p,i)=>({id:p.id||uid(),name:p.name||`Partecipante ${i+1}`,type:'adult',age:30}));d.current=o.cur||d.people[0].id;d.tasks=(o.tasks||[]).map(t=>({id:t.id||uid(),group:t.g||'Altro',name:t.name,points:t.points,for:'adult'})).concat(d.tasks.filter(t=>t.for==='child'));d.approved=(o.logs||[]).map(l=>({id:l.id||uid(),taskId:l.taskId,name:l.name,points:l.points,by:l.by,at:l.ts||Date.now(),week:monday(l.ts||Date.now()),approvedBy:l.by,legacy:true}));d.redeems=(o.redeems||[]).map(r=>({...r,for:'adult'}));d.rewards=(o.rewards||[]).map(r=>({...r,for:'adult'})).concat(d.rewards.filter(r=>r.for==='child'));d.events.push({id:uid(),text:'Dati precedenti importati',at:Date.now()});}catch(e){}return d;}
function load(){try{let s=localStorage.getItem(KEY);if(s)return JSON.parse(s);let old=localStorage.getItem(OLD);if(old)return migrateOld(JSON.parse(old));}catch(e){}return defaults();}
let S=load(),tab='home',filter='adult',rankView='week',editTasks=false,editRewards=false;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function person(id){return S.people.find(p=>p.id===id)||{name:'Persona',type:'adult'}}
function current(){return person(S.current)}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)}
function logEvent(text){S.events.unshift({id:uid(),text,at:Date.now()});}
function settleWeeks(){if(!S.settledWeeks)S.settledWeeks=[];let first=S.approved.length?Math.min(...S.approved.map(x=>x.week||monday(x.at))):monday(Date.now());for(let w=first;w<monday(Date.now());w+=7*86400000){if(S.settledWeeks.includes(w))continue;let adults=S.people.filter(p=>p.type==='adult');if(adults.length>1){let rows=adults.map(p=>({id:p.id,pts:S.approved.filter(x=>x.by===p.id&&x.week===w&&!x.kind).reduce((a,x)=>a+x.points,0),tasks:new Set(S.approved.filter(x=>x.by===p.id&&x.week===w&&!x.kind).map(x=>x.taskId)).size}));let max=Math.max(0,...rows.map(x=>x.pts));if(max>0){let top=rows.filter(x=>x.pts===max),best=Math.max(...top.map(x=>x.tasks));top=top.filter(x=>x.tasks===best);top.forEach(x=>S.approved.push({id:uid(),name:'Bonus classifica settimanale',points:S.settings.weeklyBonus,by:x.id,at:w+6*86400000+86399000,week:w,kind:'bonus'}));}}S.settledWeeks.push(w);} }
function totals(id){let approved=S.approved.filter(x=>x.by===id),earned=approved.reduce((a,x)=>a+x.points,0),spent=S.redeems.filter(x=>x.by===id).reduce((a,x)=>a+x.cost,0),week=approved.filter(x=>x.week===monday(Date.now())).reduce((a,x)=>a+x.points,0);return {earned,spent,balance:earned-spent,week,count:approved.length};}
function teamPoints(){return S.approved.filter(x=>x.week===monday(Date.now())).reduce((a,x)=>a+x.points,0)}
function childTarget(p){return p.age<=7?S.settings.childTargets.small:p.age<=11?S.settings.childTargets.medium:S.settings.childTargets.teen}
function weeklyRank(type){return S.people.filter(p=>p.type===type).map(p=>({p,...totals(p.id)})).sort((a,b)=>type==='child'?(b.week/Math.max(1,childTarget(b.p))-a.week/Math.max(1,childTarget(a.p))):(b.week-a.week));}
function openModal(content){document.querySelector('#sheet').innerHTML=content;document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

const navItems=[['home','⌂','Casa'],['tasks','✓','Faccende'],['approvals','◷','Conferme'],['rank','♛','Classifica'],['rewards','☆','Premi'],['history','≡','Storico']];
function renderNav(){document.querySelector('#nav').innerHTML=navItems.map(([id,ic,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span>${ic}</span>${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function profileBar(){return `<div class="profiles">${S.people.map(p=>`<button class="profile ${p.id===S.current?'active':''}" data-profile="${p.id}">${p.type==='child'?'🧒':'👤'} ${esc(p.name)}</button>`).join('')}<button class="profile" id="addPerson">＋ Aggiungi</button></div>`}
function header(title,desc){return `<p class="eyebrow">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</p><h1>${title}</h1><p class="sub">${desc}</p>`}

function render(){
  settleWeeks();renderNav();let p=current(),t=totals(p.id),html=profileBar();
  if(tab==='home'){
   let tp=teamPoints(),goal=S.team.goal,pct=Math.min(100,Math.round(tp/Math.max(1,goal)*100));
   html+=header('La casa è una squadra.','Piccoli gesti quotidiani, grandi risultati insieme.');
   html+=`<div class="card card-featured"><div class="row"><div><div class="eyebrow">Saldo Punti · ${esc(p.name)}</div><div class="big">${t.balance}</div><div class="sub">${t.earned} guadagnati · ${t.spent} spesi</div></div><div class="avatar" style="background:rgba(255,255,255,0.1);color:#fff">${p.type==='child'?'★':'✦'}</div></div></div>`;
   html+=`<div class="card"><div class="row"><div><div class="eyebrow">Obiettivo di squadra</div><h2 style="margin:0">${tp} / ${goal} pt</h2></div><span class="pill">${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="sub">${pct>=100?'Obiettivo raggiunto! Premio famiglia sbloccato 🎉':`Mancano ${Math.max(0,goal-tp)} punti al premio comune.`}</div><div class="sub" style="margin-top:6px;font-weight:600;color:var(--ink)">Premio: ${esc(S.team.prize)}</div></div>`;
   html+=`<div class="grid2"><div class="card"><div class="eyebrow">Attività Settimanali</div><div class="big" style="color:var(--primary);">${t.week}</div><div class="sub">punti accumulati</div></div><div class="card"><div class="eyebrow">In attesa</div><div class="big" style="color:var(--gold);">${S.pending.filter(x=>x.by===p.id).length}</div><div class="sub">da approvare</div></div></div>`;
   html+=`<h2>Azioni Rapide</h2><button class="btn" id="goTasks" style="width:100%;padding:16px;">＋ Segna una faccenda completata</button><h2>In attesa di approvazione</h2>`;
   let pend=S.pending.filter(x=>x.by===p.id);html+=pend.length?pend.slice(0,3).map(x=>`<div class="card"><div class="row"><div><b>${esc(x.name)}</b><div class="sub">${x.points} punti · in attesa di ${esc(person(x.reviewer).name)}</div></div><span class="pill" style="background:var(--gold-light);color:var(--gold);">In attesa</span></div></div>`).join(''):`<div class="card empty">Nessuna attività in attesa per ${esc(p.name)}.</div>`;
  }
  if(tab==='tasks'){
   html+=header('Faccende','Segna ciò che hai completato. Un componente dovrà confermarlo.');
   html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Figli</button><button class="btn ghost" id="toggleTaskEdit">${editTasks?'Fine modifica':'Modifica elenco'}</button></div>`;
   let groups=[...new Set(S.tasks.filter(x=>x.for===filter).map(x=>x.group))];
   groups.forEach(g=>{html+=`<h2>${esc(g)}</h2>`;S.tasks.filter(x=>x.for===filter&&x.group===g).forEach(x=>{html+=editTasks?`<div class="listrow"><div style="flex:1"><input data-taskname="${x.id}" value="${esc(x.name)}"></div><input style="width:75px" type="number" min="1" data-taskpts="${x.id}" value="${x.points}"><button class="btn danger" data-taskdel="${x.id}">×</button></div>`:`<button class="task" data-task="${x.id}"><span><b>${esc(x.name)}</b><small>${filter==='child'?'Per ragazzi':'Per adulti'}</small></span><span class="pts">+${x.points} pt</span></button>`})});
   if(editTasks)html+=`<div class="card"><h3>Nuova attività</h3><label>Nome</label><input id="newTaskName" placeholder="Es. Sistemare la dispensa"><div class="fieldrow"><div><label>Categoria</label><input id="newTaskGroup" value="Altro"></div><div><label>Punti</label><input id="newTaskPts" type="number" value="5" min="1"></div></div><button class="btn" id="saveTask" style="margin-top:12px;width:100%">Aggiungi</button></div>`;
  }
  if(tab==='approvals'){
   html+=header('Conferme','Ogni attività viene validata da un altro familiare.');
   let inbox=S.pending.filter(x=>x.reviewer===p.id);
   html+=`<h2>Da verificare (${inbox.length})</h2>`;
   html+=inbox.length?inbox.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.name)}</b><div class="sub">${esc(person(x.by).name)} · ${x.points} punti · ${fmt(x.at)}</div></div><span class="pill">Da confermare</span></div><div class="wrap" style="margin-top:14px"><button class="btn" data-approve="${x.id}">Conferma</button><button class="btn secondary" data-partial="${x.id}">Conferma 50%</button><button class="btn danger" data-reject="${x.id}">Rifiuta</button></div></div>`).join(''):`<div class="card empty">Non ci sono attività da verificare.</div>`;
   let mine=S.pending.filter(x=>x.by===p.id);html+=`<h2>In attesa per te (${mine.length})</h2>`+(mine.length?mine.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${x.points} punti · verifica di ${esc(person(x.reviewer).name)}</div></div>`).join(''):`<div class="card empty">Tutto aggiornato.</div>`);
   html+=`<h2>Ultimi Rifiuti</h2>`+(S.rejected.length?S.rejected.slice(-5).reverse().map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${esc(person(x.by).name)} · ${esc(x.reason||'Nessuna motivazione')}</div><button class="btn secondary" style="margin-top:10px;" data-resubmit="${x.id}">Correggi e reinvia</button></div>`).join(''):`<div class="sub">Nessun rifiuto recente.</div>`);
  }
  if(tab==='rank'){
   html+=header('Classifiche','Sfida e premi le buone abitudini quotidiane.');
   html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Figli</button><button class="btn ${rankView==='week'?'':'ghost'}" data-rank="week">Settimana</button><button class="btn ${rankView==='all'?'':'ghost'}" data-rank="all">Totale</button></div>`;
   let rows=filter==='child'?weeklyRank('child'):weeklyRank('adult');if(rankView==='all')rows=rows.map(x=>({...x,score:x.earned})).sort((a,b)=>b.earned-a.earned);
   html+=rows.length?rows.map((x,i)=>{let score=rankView==='all'?x.earned:(filter==='child'?Math.round(x.week/Math.max(1,childTarget(x.p))*100):x.week);return `<div class="card"><div class="row"><div class="wrap"><span class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><div><b>${esc(x.p.name)}</b><div class="sub">${filter==='child'?`${x.week}/${childTarget(x.p)} pt obiettivo`:`${x.week} pt questa settimana`}</div></div></div><span class="pill">${rankView==='all'?x.earned+' pt':filter==='child'?score+'%':score+' pt'}</span></div>${filter==='child'&&rankView==='week'?`<div class="progress"><i style="width:${Math.min(100,score)}%"></i></div>`:''}<div class="sub" style="margin-top:6px;">Totale: ${x.earned} · Disponibili: ${x.balance}</div></div>`}).join(''):`<div class="card empty">Nessun partecipante trovato.</div>`;
   if(filter==='adult'&&rankView==='week'&&rows.length>1)html+=`<div class="notice">Il vincitore settimanale riceve +${S.settings.weeklyBonus} punti bonus.</div>`;
  }
  if(tab==='rewards'){
   html+=header('Premi','Riscatta i punti guadagnati con il tuo contributo.');
   html+=`<div class="card card-featured"><div class="eyebrow">Saldo Attuale</div><div class="big">${t.balance} <span style="font-size:18px;">pt</span></div></div><div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Premi adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Premi figli</button><button class="btn ghost" id="toggleRewardEdit">${editRewards?'Fine modifica':'Modifica premi'}</button></div>`;
   S.rewards.filter(r=>r.for===filter).sort((a,b)=>a.cost-b.cost).forEach(r=>{let used=S.redeems.some(x=>x.by===p.id&&x.rewardId===r.id&&x.week===monday(Date.now())),can=p.type===filter&&t.balance>=r.cost&&!used&&S.redeems.filter(x=>x.by===p.id&&x.week===monday(Date.now())).length<S.settings.maxRedeems;
   html+=editRewards?`<div class="listrow"><input data-rewardname="${r.id}" value="${esc(r.name)}"><input style="width:80px" type="number" data-rewardcost="${r.id}" value="${r.cost}"><button class="btn danger" data-rewarddel="${r.id}">×</button></div>`:`<div class="card row"><div style="flex:1"><b>${esc(r.name)}</b><div class="sub">${r.cost} punti ${used?'· Già riscattato':''}</div></div><button class="btn" data-redeem="${r.id}" ${can?'':'disabled'}>${used?'Riscattato':t.balance<r.cost?'Infallibile':p.type!==filter?'Incompatibile':'Riscatta'}</button></div>`});
   if(editRewards)html+=`<div class="card"><h3>Nuovo premio</h3><input id="newRewardName" placeholder="Nome premio"><div class="fieldrow" style="margin-top:8px;"><input id="newRewardCost" type="number" min="1" value="50"><button class="btn" id="saveReward">Aggiungi</button></div></div>`;
  }
  if(tab==='history'){
   html+=header('Storico','Registro di tutte le attività e i riscatti.');
   let entries=[...S.approved.map(x=>({...x,kind:'ok'})),...S.pending.map(x=>({...x,kind:'wait'})),...S.redeems.map(x=>({...x,kind:'reward',at:x.at||Date.now()})),...S.events.map(x=>({...x,kind:'event'}))].sort((a,b)=>b.at-a.at);
   html+=entries.length?entries.slice(0,100).map(x=>`<div class="listrow"><div><b>${esc(x.name||x.text)}</b><div class="sub">${esc(person(x.by).name||'Sistema')} · ${fmt(x.at)} · ${x.kind==='ok'?'Approvata':x.kind==='wait'?'In attesa':x.kind==='reward'?'Premio':'Evento'}</div></div>${x.kind==='ok'?`<span class="pill">+${x.points}</span>`:x.kind==='reward'?`<span class="pill" style="background:var(--red-light);color:var(--red)">−${x.cost}</span>`:''}</div>`).join(''):`<div class="card empty">Lo storico è vuoto.</div>`;
  }
  if(tab==='settings'){
   html+=header('Impostazioni','Gestisci componenti e parametri.');
   html+=`<h2>Membri Famiglia</h2><div class="card">${S.people.map(x=>`<div class="listrow"><div style="flex:1"><input data-personname="${x.id}" value="${esc(x.name)}"><div class="sub">${x.type==='child'?'Figlio':'Adulto'} · ${x.age} anni</div></div><button class="btn ghost" data-personedit="${x.id}">Modifica</button></div>`).join('')}<button class="btn secondary" id="addPerson2" style="margin-top:12px;width:100%;">＋ Aggiungi componente</button></div>`;
   html+=`<h2>Obiettivo Squadra</h2><div class="card"><label>Punti Settimanali</label><input id="teamGoal" type="number" min="1" value="${S.team.goal}"><label>Premio Comune</label><input id="teamPrize" value="${esc(S.team.prize)}"><button class="btn" id="saveTeam" style="margin-top:12px;width:100%;">Salva Obiettivo</button></div>`;
   html+=`<h2>Backup e Dati</h2><div class="card"><div class="wrap"><button class="btn secondary" id="export">Esporta JSON</button><label class="btn ghost" style="margin:0;cursor:pointer;">Importa JSON<input id="import" type="file" accept="application/json" hidden></label><button class="btn danger" id="reset">Azzera</button></div></div>`;
  }

  document.querySelector('#app').innerHTML=html;
  
  // Handlers
  document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{S.current=b.dataset.profile;save();render()});
  document.querySelector('#settingsShortcut').onclick=()=>{tab='settings';render()};
  document.querySelector('#goTasks')?.addEventListener('click',()=>{tab='tasks';render()});
  document.querySelector('#addPerson')?.addEventListener('click',()=>personForm());
  document.querySelector('#addPerson2')?.addEventListener('click',()=>personForm());
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
  document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{rankView=b.dataset.rank;render()});
  document.querySelector('#toggleTaskEdit')?.addEventListener('click',()=>{editTasks=!editTasks;render()});
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskForm(b.dataset.task));
  document.querySelector('#saveTask')?.addEventListener('click',()=>{let name=document.querySelector('#newTaskName').value.trim(),points=+document.querySelector('#newTaskPts').value,group=document.querySelector('#newTaskGroup').value.trim()||'Altro';if(!name||points<1)return toast('Inserisci nome e punti validi');S.tasks.push({id:uid(),name,points,group,for:filter});logEvent('Nuova attività: '+name);save();render()});
  document.querySelectorAll('[data-taskname]').forEach(i=>i.onchange=()=>{let x=S.tasks.find(t=>t.id===i.dataset.taskname);if(x&&i.value.trim())x.name=i.value.trim();save()});
  document.querySelectorAll('[data-taskpts]').forEach(i=>i.onchange=()=>{let x=S.tasks.find(t=>t.id===i.dataset.taskpts);if(x&&+i.value>0)x.points=+i.value;save()});
  document.querySelectorAll('[data-taskdel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare questa attività?')){S.tasks=S.tasks.filter(x=>x.id!==b.dataset.taskdel);save();render()}});
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,'approved',1));
  document.querySelectorAll('[data-partial]').forEach(b=>b.onclick=()=>decide(b.dataset.partial,'approved',.5));
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{let id=b.dataset.reject,x=S.pending.find(y=>y.id===id);openModal(`<h2>Motivo Rifiuto</h2><input id="rejectReason" placeholder="Motivo"><div class="wrap" style="margin-top:15px"><button class="btn danger" id="confirmReject">Conferma Rifiuto</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`);document.querySelector('#confirmReject').onclick=()=>{x.reason=document.querySelector('#rejectReason').value.trim()||'Da verificare';S.pending=S.pending.filter(y=>y.id!==id);S.rejected.push(x);logEvent('Attività rifiutata: '+x.name);save();closeModal();render()}});
  document.querySelectorAll('[data-resubmit]').forEach(b=>b.onclick=()=>{let x=S.rejected.find(y=>y.id===b.dataset.resubmit);if(!x)return;let others=S.people.filter(y=>y.id!==x.by);if(!others.length)return toast('Aggiungi un altro componente per approvare');openModal(`<h2>Correggi e reinvia</h2><p>${esc(x.name)} · ${x.points} pt</p><label>Verificatore</label><select id="newReviewer">${others.map(y=>`<option value="${y.id}">${esc(y.name)}</option>`).join('')}</select><button class="btn" id="resubmitNow" style="margin-top:14px">Invia</button>`);document.querySelector('#resubmitNow').onclick=()=>{x.reviewer=document.querySelector('#newReviewer').value;x.at=Date.now();delete x.reason;S.rejected=S.rejected.filter(y=>y.id!==x.id);S.pending.push(x);save();closeModal();render()}});
  document.querySelector('#toggleRewardEdit')?.addEventListener('click',()=>{editRewards=!editRewards;render()});
  document.querySelector('#saveReward')?.addEventListener('click',()=>{let name=document.querySelector('#newRewardName').value.trim(),cost=+document.querySelector('#newRewardCost').value;if(!name||cost<1)return toast('Inserisci valore valido');S.rewards.push({id:uid(),name,cost,for:filter});save();render()});
  document.querySelectorAll('[data-rewarddel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminare premio?')){S.rewards=S.rewards.filter(x=>x.id!==b.dataset.rewarddel);save();render()}});
  document.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>{let r=S.rewards.find(x=>x.id===b.dataset.redeem),p=current(),t=totals(p.id);if(p.type!==r.for||t.balance<r.cost)return;if(!confirm(`Riscattare "${r.name}"?`))return;S.redeems.push({id:uid(),rewardId:r.id,name:r.name,cost:r.cost,by:p.id,for:r.for,at:Date.now(),week:monday(Date.now())});logEvent(p.name+' riscatto: '+r.name);save();render();toast('Premio Riscattato!')});
  document.querySelector('#saveTeam')?.addEventListener('click',()=>{S.team.goal=Math.max(1,+document.querySelector('#teamGoal').value||1);S.team.prize=document.querySelector('#teamPrize').value.trim()||'Premio famiglia';save();render();toast('Obiettivo aggiornato')});
  document.querySelectorAll('[data-personedit]').forEach(b=>b.onclick=()=>personForm(b.dataset.personedit));
  document.querySelector('#export')?.addEventListener('click',()=>{let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='casa-club-backup.json';a.click();URL.revokeObjectURL(a.href)});
  document.querySelector('#import')?.addEventListener('change',async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.people||!obj.tasks)throw Error();if(confirm('Sostituire i dati attuali con il backup?')){S=obj;save();render();toast('Backup importato')}}catch(err){toast('File di backup non valido')}});
  document.querySelector('#reset')?.addEventListener('click',()=>{if(confirm('Cancellare i dati locali?')){S=defaults();save();render()}});
}

function personForm(id){let p=id?person(id):{name:'',type:'adult',age:30},editing=!!id;openModal(`<h2>${editing?'Modifica':'Aggiungi'} Membro</h2><label>Nome</label><input id="personName" value="${esc(p.name)}" placeholder="Nome"><label>Tipo</label><select id="personType"><option value="adult" ${p.type==='adult'?'selected':''}>Adulto</option><option value="child" ${p.type==='child'?'selected':''}>Figlio</option></select><label>Età</label><input id="personAge" type="number" min="1" max="99" value="${p.age||8}"><div class="wrap" style="margin-top:15px"><button class="btn" id="savePerson">Salva</button><button class="btn ghost" onclick="closeModal()">Annulla</button>${editing?`<button class="btn danger" id="deletePerson">Elimina</button>`:''}</div>`);document.querySelector('#savePerson').onclick=()=>{let name=document.querySelector('#personName').value.trim(),type=document.querySelector('#personType').value,age=Math.max(1,+document.querySelector('#personAge').value||1);if(!name)return toast('Inserisci un nome');if(editing)Object.assign(p,{name,type,age});else{p={id:uid(),name,type,age};S.people.push(p);S.current=p.id}logEvent((editing?'Modificato: ':'Aggiunto: ')+name);save();closeModal();render()};document.querySelector('#deletePerson')?.addEventListener('click',()=>{if(S.people.length<=1)return toast('Sempre presente almeno 1 membro');if(confirm('Eliminare profilo?')){S.people=S.people.filter(x=>x.id!==id);if(S.current===id)S.current=S.people[0].id;save();closeModal();render()}})}
function taskForm(taskId){let task=S.tasks.find(x=>x.id===taskId),p=current(),others=S.people.filter(x=>x.id!==p.id);if(task.for!==p.type)return toast(task.for==='child'?'Seleziona profilo figlio.':'Seleziona profilo adulto.');if(!others.length)return toast('Aggiungi un altro componente per la verifica');openModal(`<h2>Segna attività</h2><p><b>${esc(task.name)}</b> · ${task.points} punti</p><label>Verificatore</label><select id="reviewer">${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Data</label><input type="date" id="taskDate" value="${new Date().toISOString().slice(0,10)}"><div class="wrap" style="margin-top:15px"><button class="btn" id="sendTask">Invia</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`);document.querySelector('#sendTask').onclick=()=>{let reviewer=document.querySelector('#reviewer').value,date=new Date(document.querySelector('#taskDate').value+'T12:00:00');if(!reviewer||isNaN(+date))return toast('Dati non validi');S.pending.push({id:uid(),taskId:task.id,name:task.name,points:task.points,by:p.id,reviewer,at:+date,week:monday(+date)});logEvent(p.name+' inviato: '+task.name);save();closeModal();render();toast('Inviata!')}}
function decide(id,target,factor){let x=S.pending.find(y=>y.id===id);if(!x)return;if(x.reviewer!==S.current)return toast('Verificatore non corrispondente');S.pending=S.pending.filter(y=>y.id!==id);if(target==='approved'){let pts=Math.round(x.points*factor);S.approved.push({...x,points:pts,approvedBy:S.current,approvedAt:Date.now(),partial:factor<1});logEvent(`${person(x.reviewer).name} approvato ${x.name} (${pts} pt)`);if(factor<1)toast('Approvato al 50%')}save();render()}

S=load();if(!S.team)S.team=defaults().team;if(!S.settings)S.settings=defaults().settings;if(!S.pending)S.pending=[];if(!S.approved)S.approved=[];if(!S.rejected)S.rejected=[];if(!S.events)S.events=[];if(!S.settledWeeks)S.settledWeeks=[];if(!S.people?.length)S.people=defaults().people;if(!S.current||!S.people.some(x=>x.id===S.current))S.current=S.people[0].id;save();render();
</script>
</body>
</html>

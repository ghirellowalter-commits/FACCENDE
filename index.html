<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>CASA CLUB — La casa è una squadra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --paper: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #6366f1;
  --primary-light: #eef2ff;
  --gold: #f59e0b;
  --gold-light: #fef3c7;
  --red: #ef4444;
  --red-light: #fef2f2;
  --green: #10b981;
  --green-light: #ecfdf5;
  --pink: #ec4899;
  --pink-light: #fce7f3;
  --blue: #3b82f6;
  --blue-light: #eff6ff;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.04);
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 20px 30px -10px rgba(15, 23, 42, 0.15);
}

/* Colori dinamici in base alle tab */
body[data-tab="home"] { --theme-accent: #6366f1; --theme-bg: #f5f3ff; }
body[data-tab="tasks"] { --theme-accent: #10b981; --theme-bg: #f0fdf4; }
body[data-tab="approvals"] { --theme-accent: #f59e0b; --theme-bg: #fffbeb; }
body[data-tab="rank"] { --theme-accent: #8b5cf6; --theme-bg: #faf5ff; }
body[data-tab="rewards"] { --theme-accent: #ec4899; --theme-bg: #fdf2f8; }
body[data-tab="history"] { --theme-accent: #3b82f6; --theme-bg: #eff6ff; }
body[data-tab="settings"] { --theme-accent: #475569; --theme-bg: #f8fafc; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--theme-bg, var(--bg));
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  transition: background-color 0.3s ease;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }
button { cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: none; }
button:active { transform: scale(0.97); }

main {
  max-width: 680px;
  margin: auto;
  padding: 20px 20px calc(110px + env(safe-area-inset-bottom));
}

/* Header & Brand */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 10px 0 20px;
}
.brand { display: flex; align-items: center; gap: 14px; }
.mark {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--theme-accent, #6366f1), #4338ca);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 22px;
  box-shadow: 0 8px 16px -4px rgba(99, 102, 241, 0.4);
}
.brand strong { display: block; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); }
.brand small { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }

.btn-icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink);
  display: grid;
  place-items: center;
  font-size: 18px;
  box-shadow: var(--shadow-sm);
}

/* Typography */
.eyebrow {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 800;
  margin: 0 0 6px;
}
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 6px; color: var(--ink); }
h2 { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin: 26px 0 12px; }
h3 { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 13.5px; font-weight: 500; }

/* Cards & Layout */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin: 14px 0;
  box-shadow: var(--shadow);
}
.card-user-male {
  background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
  color: #fff;
  border: none;
}
.card-user-female {
  background: linear-gradient(135deg, #831843 0%, #ec4899 100%);
  color: #fff;
  border: none;
}
.card-user-child {
  background: linear-gradient(135deg, #78350f 0%, #f59e0b 100%);
  color: #fff;
  border: none;
}
.card-user-male .eyebrow, .card-user-female .eyebrow, .card-user-child .eyebrow,
.card-user-male .sub, .card-user-female .sub, .card-user-child .sub { color: rgba(255, 255, 255, 0.8); }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wrap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Profile Bar */
.profiles { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 16px; scrollbar-width: none; }
.profiles::-webkit-scrollbar { display: none; }
.profile {
  border: 1.5px solid var(--line);
  background: var(--paper);
  border-radius: 99px;
  padding: 8px 16px;
  white-space: nowrap;
  color: var(--ink);
  font-weight: 700;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow-sm);
}
.profile.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
}

/* Kanban Columns & Kanban View */
.kanban-board {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.kanban-col {
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.kanban-col h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }

/* Navigation Bar */
nav {
  position: fixed;
  z-index: 10;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  max-width: 520px;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 24px;
  padding: 6px;
  display: flex;
  justify-content: space-between;
  gap: 4px;
  box-shadow: var(--shadow-lg), 0 0 0 1px rgba(0, 0, 0, 0.05);
}
nav button {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 18px;
  padding: 8px 2px;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
nav button span { font-size: 18px; }
nav button.active {
  background: var(--theme-accent, var(--ink));
  color: #fff;
}

/* Buttons */
.btn {
  border: 0;
  background: var(--theme-accent, var(--ink));
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-weight: 700;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
}
.btn.secondary { background: var(--paper); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; }
.btn.danger { background: var(--red-light); color: var(--red); box-shadow: none; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

.big { font-size: 42px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.pill {
  display: inline-flex;
  align-items: center;
  background: var(--paper);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.progress {
  height: 10px;
  border-radius: 99px;
  background: #e2e8f0;
  overflow: hidden;
  margin: 12px 0;
}
.progress > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--theme-accent, #6366f1), #a855f7);
  border-radius: 99px;
  transition: width 0.4s ease;
}

/* Task Card */
.task {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin: 8px 0;
  text-align: left;
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}
.task b { font-weight: 700; font-size: 15px; }
.task small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.task .pts { color: var(--theme-accent, var(--primary)); font-weight: 800; font-size: 14px; white-space: nowrap; }

/* Feed List */
.feed-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin: 8px 0;
}
.feed-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--theme-bg);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}

/* Inputs */
input, select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--theme-accent, var(--primary)); }
label { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.fieldrow { display: grid; grid-template-columns: 1fr 100px; gap: 10px; }

.listrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.listrow:last-child { border: 0; }

.notice {
  background: var(--gold-light);
  border: 1px solid #fde68a;
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  color: #92400e;
  font-size: 13px;
  font-weight: 600;
  margin: 14px 0;
}

.empty { padding: 32px 16px; text-align: center; color: var(--muted); font-weight: 600; }
.rank { font-weight: 800; font-size: 22px; color: var(--gold); width: 28px; text-align: center; }
.avatar { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, 0.2); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; }

/* Modal & Toast */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(6px);
  z-index: 20;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}
.modal.open { display: flex; }
.sheet {
  width: min(100%, 540px);
  background: var(--paper);
  border-radius: 28px;
  padding: 24px;
  max-height: 85dvh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.25s cubic-bezier(0, 0, 0.2, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.toast {
  position: fixed;
  z-index: 30;
  left: 50%;
  bottom: calc(95px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #fff;
  border-radius: 99px;
  padding: 12px 22px;
  font-weight: 700;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0, 0, 0.2, 1);
  box-shadow: var(--shadow-lg);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

@media(min-width: 650px) {
  main { padding-top: 40px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2 .card { margin: 0; }
  .modal { align-items: center; }
}
</style>
</head>
<body data-tab="home">
<main>
<header>
  <div class="brand">
    <div class="mark">C</div>
    <div><strong>CASA CLUB</strong><small>OGNI GESTO CONTA</small></div>
  </div>
  <button class="btn-icon" id="settingsShortcut" aria-label="Impostazioni">⚙</button>
</header>
<div id="app"></div>
</main>

<nav id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='casa_club_v2_local', OLD='oasis_home_local_v1';
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const monday=t=>{let d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return +d};
const fmt=t=>new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short'});

/* Faccende Adulti */
const ADULT=[
['1. Cucina',[['Caricare lavastoviglie',5],['Scaricare lavastoviglie',6],['Lavare piatti a mano',5],['Pulire lavello',3],['Pulire piano cottura',4],['Pulire tavolo e superfici',3],['Pulire microonde',3],['Pulire frigorifero',6],['Spazzare e lavare pavimento',6],['Riordinare tutta la cucina',6]]],
['2. Bucato',[['Separare e preparare bucato',2],['Caricare lavatrice',3],['Stendere bucato',5],['Ritirare bucato',4],['Piegare vestiti',5],['Riporre vestiti',4],['Stirare un carico',7],['Cambiare lenzuola',6],['Rifare il letto',3],['Riordinare armadio',8]]],
['3. Bagno',[['Pulire lavandino',3],['Pulire specchio',2],['Pulire WC',5],['Pulire doccia',6],['Pulire vasca',6],['Pulire rubinetteria',3],['Cambiare asciugamani',2],['Svuotare cestino',2],['Lavare pavimento',4],['Pulizia completa bagno',8]]],
['4. Soggiorno e camere',[['Riordinare soggiorno',4],['Sistemare divano e cuscini',2],['Spolverare mobili',4],['Spolverare mensole',3],['Passare aspirapolvere',6],['Lavare pavimenti',7],['Pulire vetri e specchi',5],['Riordinare camera',4],['Rifare letti',3],['Pulire tappeti',5]]],
['5. Rifiuti e riciclo',[['Svuotare cestino cucina',2],['Svuotare cestini bagno e camere',2],['Separare rifiuti',2],['Portare fuori spazzatura',3],['Portare fuori vetro',3],['Portare fuori plastica e carta',3],['Cambiare sacchetti',1],['Pulire bidoni',4],['Riordinare zona raccolta',3],['Portare materiali al centro raccolta',6]]],
['6. Spesa e pasti',[['Preparare lista spesa',2],['Fare la spesa',8],['Sistemare la spesa',4],['Riordinare frigorifero',6],['Riordinare dispensa',6],['Preparare colazione',3],['Preparare pranzo',6],['Preparare cena',8],['Preparare pasto completo',12],['Riordinare cucina dopo il pasto',4]]],
['7. Animali, piante ed esterni',[['Annaffiare piante',2],['Potare piante',4],['Pulire vasi e foglie',3],['Spazzare balcone',4],['Lavare balcone',6],['Dare da mangiare agli animali',2],['Cambiare acqua agli animali',1],['Pulire ciotole',2],['Pulire lettiera',4],['Portare fuori il cane',4]]],
['8. Organizzazione e manutenzione',[['Riordinare ripostiglio',7],['Riordinare garage',8],['Riordinare cantina',8],['Organizzare armadi',8],['Pulire porte e maniglie',4],['Pulire termosifoni',5],['Pulire finestre',8],['Pulire sotto i mobili',6],['Piccola riparazione domestica',5],['Organizzare una zona della casa',6]]]
];

/* Faccende Figli */
const CHILD=[
['1. Camera personale',[['Riordinare giochi',2],['Mettere libri a posto',2],['Mettere vestiti sporchi nel cesto',2],['Sistemare scarpe',2],['Appendere giacca e zaino',2],['Riordinare scrivania',3],['Preparare zaino',3],['Preparare vestiti per domani',2],['Rifare letto',3],['Riordinare tutta la camera',5]]],
['2. Aiuto in cucina',[['Apparecchiare',3],['Sparecchiare',3],['Portare piatti al lavello',2],['Sistemare sedie',1],['Pulire il proprio posto',2],['Pulire tavolo con panno',2],['Lavare frutta e verdura',2],['Preparare merenda semplice',3],['Mettere via posate pulite',2],['Aiutare a sistemare la spesa',3]]],
['3. Riordino della casa',[['Raccogliere oggetti in giro',2],['Sistemare cuscini e divano',2],['Piegare coperte',2],['Riordinare scarpe',2],['Spolverare superfici basse',2],['Spazzare una piccola zona',3],['Riordinare libri',2],['Piegare asciugamani',2],['Abbinare calzini',2],['Riordinare una zona comune',3]]],
['4. Bucato',[['Portare vestiti al cesto',2],['Separare calzini',2],['Abbinare calzini puliti',2],['Piegare piccoli capi',2],['Piegare asciugamani',2],['Riporre vestiti',3],['Mettere via pigiama',2],['Preparare cambio sportivo',2],['Raccogliere piccoli capi stesi',2],['Aiutare a stendere piccoli capi',3]]],
['5. Animali e piante',[['Riempire ciotola acqua',2],['Preparare cibo già dosato',2],['Spazzolare animale tranquillo',3],['Riordinare giochi dell’animale',2],['Annaffiare piante',2],['Raccogliere foglie',2],['Pulire un vaso',2],['Riordinare accessori animali',2],['Aiutare nella cura dell’animale',3],['Preparare gli accessori per la passeggiata',2]]],
['6. Autonomia personale',[['Preparare zaino senza aiuto',3],['Preparare vestiti per domani',2],['Riordinare scrivania',3],['Completare routine mattutina',3],['Completare routine serale',3],['Preparare borsa sportiva',3],['Gestire lista di cose da fare',3],['Preparare materiale scolastico',2],['Tenere in ordine la camera',3],['Completare missione senza promemoria',1]]]
];

const ADULT_REWARDS=[['Scegliere il film della serata',30],['Colazione a letto',50],['Massaggio di 20 minuti',60],['Una giornata senza faccende',120],['Cena fuori scelta da me',180],['Regalo a sorpresa',350]];
const CHILD_REWARDS=[['30 minuti di gioco extra',30],['Scegliere il film',40],['Paghetta da 5 €',50],['Uscita speciale',100],['Esperienza speciale',300],['Nuovo videogame',400]];

function defaults(){
  return {
    version:3,
    people:[
      {id:'p1',name:'Papà',type:'adult',gender:'male',age:38},
      {id:'p2',name:'Mamma',type:'adult',gender:'female',age:36},
      {id:'c1',name:'Luca',type:'child',gender:'male',age:8}
    ],
    current:'p1',
    tasks:[...ADULT.flatMap(([g,a])=>a.map(([name,points])=>({id:uid(),group:g,name,points,for:'adult'}))),...CHILD.flatMap(([g,a])=>a.map(([name,points])=>({id:uid(),group:g,name,points,for:'child'})))],
    pending:[],approved:[],rejected:[],redeems:[],
    rewards:[...ADULT_REWARDS.map(([name,cost])=>({id:uid(),name,cost,for:'adult'})),...CHILD_REWARDS.map(([name,cost])=>({id:uid(),name,cost,for:'child'}))],
    team:{goal:200,week:monday(Date.now()),prize:'Serata Pizza & Videogame'},
    settings:{weeklyBonus:20,maxRedeems:2,childTargets:{small:25,medium:40,teen:55}},
    events:[],settledWeeks:[]
  };
}

function load(){
  try{
    let s=localStorage.getItem(KEY);
    if(s)return JSON.parse(s);
    let old=localStorage.getItem(OLD);
    if(old)return JSON.parse(old);
  }catch(e){}
  return defaults();
}

let S=load(),tab='home',filter='adult',rankView='week',editTasks=false,editRewards=false;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function person(id){return S.people.find(p=>p.id===id)||(S.people[0]||{name:'Persona',type:'adult',gender:'male'})}
function current(){return person(S.current)}
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)}
function logEvent(text){S.events.unshift({id:uid(),text,at:Date.now()});}

function totals(id){
  let approved=S.approved.filter(x=>x.by===id),
      earned=approved.reduce((a,x)=>a+x.points,0),
      spent=S.redeems.filter(x=>x.by===id).reduce((a,x)=>a+x.cost,0),
      week=approved.filter(x=>x.week===monday(Date.now())).reduce((a,x)=>a+x.points,0);
  return {earned,spent,balance:earned-spent,week,count:approved.length};
}
function teamPoints(){return S.approved.filter(x=>x.week===monday(Date.now())).reduce((a,x)=>a+x.points,0)}
function childTarget(p){return p.age<=7?S.settings.childTargets.small:p.age<=11?S.settings.childTargets.medium:S.settings.childTargets.teen}
function weeklyRank(type){return S.people.filter(p=>p.type===type).map(p=>({p,...totals(p.id)})).sort((a,b)=>type==='child'?(b.week/Math.max(1,childTarget(b.p))-a.week/Math.max(1,childTarget(a.p))):(b.week-a.week));}

function openModal(content){document.querySelector('#sheet').innerHTML=content;document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

const navItems=[['home','⚡','Feed'],['tasks','✓','Faccende'],['approvals','◷','Conferme'],['rank','🏆','Gamification'],['rewards','🎁','Premi'],['settings','⚙️','Impostazioni']];
function renderNav(){document.querySelector('#nav').innerHTML=navItems.map(([id,ic,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span>${ic}</span>${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.body.setAttribute('data-tab',tab);render()})}

function profileBar(){
  return `<div class="profiles">${S.people.map(p=>{
    let icon = p.type==='child' ? (p.gender==='female'?'👧':'👦') : (p.gender==='female'?'👩':'👨');
    return `<button class="profile ${p.id===S.current?'active':''}" data-profile="${p.id}">${icon} ${esc(p.name)}</button>`;
  }).join('')}<button class="profile" id="addPerson">＋ Nuovo</button></div>`;
}

function header(title,desc){return `<p class="eyebrow">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</p><h1>${title}</h1><p class="sub">${desc}</p>`}

function getUserCardClass(p){
  if(p.type==='child') return 'card-user-child';
  return p.gender==='female' ? 'card-user-female' : 'card-user-male';
}

function render(){
  renderNav();let p=current(),t=totals(p.id),html=profileBar();
  
  // TAB 1: FEED & ACTION CENTER
  if(tab==='home'){
   let tp=teamPoints(),goal=S.team.goal,pct=Math.min(100,Math.round(tp/Math.max(1,goal)*100));
   let cardStyle = getUserCardClass(p);
   let userIcon = p.type==='child' ? (p.gender==='female'?'👧':'👦') : (p.gender==='female'?'👩':'👨');
   
   html+=header('Ciao, '+esc(p.name)+'! '+userIcon, 'Ecco il tuo riepilogo e il feed di famiglia.');
   
   // Card personalizzata sul genere
   html+=`<div class="card ${cardStyle}"><div class="row"><div><div class="eyebrow">Saldo Punti Personale</div><div class="big">${t.balance} pt</div><div class="sub">${t.earned} guadagnati finora</div></div><div class="avatar">${userIcon}</div></div></div>`;
   
   // Plancia Obiettivo
   html+=`<div class="card"><div class="row"><div><div class="eyebrow">Obiettivo Squadra</div><h2 style="margin:0">${tp} / ${goal} pt</h2></div><span class="pill">${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="sub">Premio: <b>${esc(S.team.prize)}</b></div></div>`;
   
   html+=`<button class="btn" id="goTasks" style="width:100%;padding:16px;font-size:16px;">⚡ Segna subito una faccenda</button>`;
   
   // Feed Attività Recenti
   html+=`<h2>💬 Feed Attività di Famiglia</h2>`;
   let entries=[...S.approved.map(x=>({...x,kind:'ok'})),...S.redeems.map(x=>({...x,kind:'reward',at:x.at||Date.now()}))].sort((a,b)=>b.at-a.at).slice(0,5);
   html+=entries.length?entries.map(x=>`<div class="feed-item"><div class="feed-icon">${x.kind==='ok'?'✓':'🎁'}</div><div style="flex:1"><b>${esc(person(x.by).name)}</b> ${x.kind==='ok'?'ha svolto':'ha riscattato'} <b>${esc(x.name)}</b><div class="sub">${fmt(x.at)}</div></div><span class="pill" style="color:${x.kind==='ok'?'var(--green)':'var(--red)'}">${x.kind==='ok'?'+'+x.points:'-'+x.cost} pt</span></div>`).join(''):`<div class="card empty">Nessun evento recente nel feed.</div>`;
  }
  
  // TAB 2: FACCENDE (Stile Kanban / Liste)
  if(tab==='tasks'){
   html+=header('Faccende Domestiche','Scegli una faccenda da completare.');
   html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Figli</button><button class="btn ghost" id="toggleTaskEdit">${editTasks?'Fine modifica':'Modifica'}</button></div>`;
   
   let groups=[...new Set(S.tasks.filter(x=>x.for===filter).map(x=>x.group))];
   groups.forEach(g=>{
     html+=`<h2>${esc(g)}</h2>`;
     S.tasks.filter(x=>x.for===filter&&x.group===g).forEach(x=>{
       html+=editTasks?`<div class="listrow"><div style="flex:1"><input data-taskname="${x.id}" value="${esc(x.name)}"></div><input style="width:75px" type="number" min="1" data-taskpts="${x.id}" value="${x.points}"><button class="btn danger" data-taskdel="${x.id}">×</button></div>`:`<button class="task" data-task="${x.id}"><span><b>${esc(x.name)}</b><small>${filter==='child'?'Per ragazzi':'Per adulti'}</small></span><span class="pts">+${x.points} pt</span></button>`;
     });
   });
   if(editTasks)html+=`<div class="card"><h3>Nuova attività</h3><label>Nome</label><input id="newTaskName" placeholder="Es. Pulire la scrivania"><div class="fieldrow"><div><label>Categoria</label><input id="newTaskGroup" value="Altro"></div><div><label>Punti</label><input id="newTaskPts" type="number" value="5" min="1"></div></div><button class="btn" id="saveTask" style="margin-top:12px;width:100%">Aggiungi</button></div>`;
  }
  
  // TAB 3: CONFERME (Bacheca Visuale)
  if(tab==='approvals'){
   html+=header('Conferme & Verifiche','Approva le faccende svolte dagli altri membri.');
   let inbox=S.pending.filter(x=>x.reviewer===p.id);
   html+=`<div class="kanban-board"><div class="kanban-col"><h3>Da Verificare per te (${inbox.length})</h3>`;
   html+=inbox.length?inbox.map(x=>`<div class="card" style="margin:8px 0;"><b>${esc(x.name)}</b><div class="sub">${esc(person(x.by).name)} • ${x.points} pt</div><div class="wrap" style="margin-top:10px;"><button class="btn" data-approve="${x.id}">✓ OK</button><button class="btn secondary" data-partial="${x.id}">50%</button><button class="btn danger" data-reject="${x.id}">✕</button></div></div>`).join(''):`<div class="empty">Niente da verificare.</div>`;
   html+=`</div><div class="kanban-col"><h3>Le tue in attesa (${S.pending.filter(x=>x.by===p.id).length})</h3>`;
   let mine=S.pending.filter(x=>x.by===p.id);
   html+=mine.length?mine.map(x=>`<div class="card" style="margin:8px 0;"><b>${esc(x.name)}</b><div class="sub">Verifica di ${esc(person(x.reviewer).name)}</div></div>`).join(''):`<div class="empty">Tutte approvate!</div>`;
   html+=`</div></div>`;
  }
  
  // TAB 4: GAMIFICATION & CLASSIFICA
  if(tab==='rank'){
   html+=header('Gamification & Livelli','Classifiche e livelli XP di squadra.');
   html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Figli</button><button class="btn ${rankView==='week'?'':'ghost'}" data-rank="week">Settimana</button><button class="btn ${rankView==='all'?'':'ghost'}" data-rank="all">Totale</button></div>`;
   
   let rows=filter==='child'?weeklyRank('child'):weeklyRank('adult');
   if(rankView==='all')rows=rows.map(x=>({...x,score:x.earned})).sort((a,b)=>b.earned-a.earned);
   
   html+=rows.length?rows.map((x,i)=>{
     let score=rankView==='all'?x.earned:(filter==='child'?Math.round(x.week/Math.max(1,childTarget(x.p))*100):x.week);
     let icon = x.p.type==='child' ? (x.p.gender==='female'?'👧':'👦') : (x.p.gender==='female'?'👩':'👨');
     let lvl = Math.floor(x.earned / 50) + 1;
     return `<div class="card"><div class="row"><div class="wrap"><span class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</span><div><b>${icon} ${esc(x.p.name)}</b> <span class="pill" style="font-size:10px;">Lvl ${lvl}</span><div class="sub">${x.week} pt questa settimana</div></div></div><span class="pill" style="font-size:14px;background:var(--theme-accent);color:#fff">${score} pt</span></div><div class="progress"><i style="width:${Math.min(100,score)}%"></i></div></div>`;
   }).join(''):`<div class="card empty">Nessun partecipante.</div>`;
  }
  
  // TAB 5: PREMI
  if(tab==='rewards'){
   html+=header('Catalogo Premi','Riscatta i tuoi punti per premi fantastici.');
   let cardStyle = getUserCardClass(p);
   html+=`<div class="card ${cardStyle}"><div class="eyebrow">Il tuo saldo</div><div class="big">${t.balance} pt</div></div>`;
   html+=`<div class="wrap"><button class="btn ${filter==='adult'?'':'secondary'}" data-filter="adult">Premi Adulti</button><button class="btn ${filter==='child'?'':'secondary'}" data-filter="child">Premi Figli</button><button class="btn ghost" id="toggleRewardEdit">${editRewards?'Fine modifica':'Modifica'}</button></div>`;
   
   S.rewards.filter(r=>r.for===filter).sort((a,b)=>a.cost-b.cost).forEach(r=>{
     let used=S.redeems.some(x=>x.by===p.id&&x.rewardId===r.id&&x.week===monday(Date.now())),
         can=p.type===filter&&t.balance>=r.cost&&!used;
     html+=editRewards?`<div class="listrow"><input data-rewardname="${r.id}" value="${esc(r.name)}"><input style="width:80px" type="number" data-rewardcost="${r.id}" value="${r.cost}"><button class="btn danger" data-rewarddel="${r.id}">×</button></div>`:`<div class="card row"><div style="flex:1"><b>${esc(r.name)}</b><div class="sub">${r.cost} punti</div></div><button class="btn" data-redeem="${r.id}" ${can?'':'disabled'}>${used?'Già preso':t.balance<r.cost?'Infallibile':'Riscatta'}</button></div>`;
   });
   if(editRewards)html+=`<div class="card"><h3>Nuovo premio</h3><input id="newRewardName" placeholder="Nome premio"><div class="fieldrow" style="margin-top:8px;"><input id="newRewardCost" type="number" min="1" value="50"><button class="btn" id="saveReward">Aggiungi</button></div></div>`;
  }
  
  // TAB 6: IMPOSTAZIONI & PROFILI (Genere e Fascia)
  if(tab==='settings'){
   html+=header('Impostazioni','Gestisci componenti, genere e parametri.');
   html+=`<h2>Membri Famiglia</h2><div class="card">${S.people.map(x=>{
     let gLabel = x.gender==='female' ? 'Donna/Ragazza' : 'Uomo/Ragazzo';
     return `<div class="listrow"><div style="flex:1"><b>${esc(x.name)}</b><div class="sub">${x.type==='child'?'Figlio':'Adulto'} • ${gLabel} • ${x.age} anni</div></div><button class="btn ghost" data-personedit="${x.id}">Modifica</button></div>`;
   }).join('')}<button class="btn secondary" id="addPerson2" style="margin-top:12px;width:100%;">＋ Aggiungi Componente</button></div>`;
   
   html+=`<h2>Obiettivo Squadra</h2><div class="card"><label>Punti Settimanali</label><input id="teamGoal" type="number" min="1" value="${S.team.goal}"><label>Premio Comune</label><input id="teamPrize" value="${esc(S.team.prize)}"><button class="btn" id="saveTeam" style="margin-top:12px;width:100%;">Salva Obiettivo</button></div>`;
  }

  document.querySelector('#app').innerHTML=html;
  
  // Handlers
  document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{S.current=b.dataset.profile;save();render()});
  document.querySelector('#settingsShortcut').onclick=()=>{tab='settings';document.body.setAttribute('data-tab','settings');render()};
  document.querySelector('#goTasks')?.addEventListener('click',()=>{tab='tasks';document.body.setAttribute('data-tab','tasks');render()});
  document.querySelector('#addPerson')?.addEventListener('click',()=>personForm());
  document.querySelector('#addPerson2')?.addEventListener('click',()=>personForm());
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
  document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{rankView=b.dataset.rank;render()});
  document.querySelector('#toggleTaskEdit')?.addEventListener('click',()=>{editTasks=!editTasks;render()});
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>taskForm(b.dataset.task));
  document.querySelector('#saveTask')?.addEventListener('click',()=>{let name=document.querySelector('#newTaskName').value.trim(),points=+document.querySelector('#newTaskPts').value,group=document.querySelector('#newTaskGroup').value.trim()||'Altro';if(!name||points<1)return toast('Inserisci nome e punti validi');S.tasks.push({id:uid(),name,points,group,for:filter});logEvent('Nuova attività: '+name);save();render()});
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>decide(b.dataset.approve,'approved',1));
  document.querySelectorAll('[data-partial]').forEach(b=>b.onclick=()=>decide(b.dataset.partial,'approved',.5));
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{let id=b.dataset.reject,x=S.pending.find(y=>y.id===id);openModal(`<h2>Motivo Rifiuto</h2><input id="rejectReason" placeholder="Motivo"><div class="wrap" style="margin-top:15px"><button class="btn danger" id="confirmReject">Conferma Rifiuto</button><button class="btn ghost" onclick="closeModal()">Annulla</button></div>`);document.querySelector('#confirmReject').onclick=()=>{x.reason=document.querySelector('#rejectReason').value.trim()||'Da verificare';S.pending=S.pending.filter(y=>y.id!==id);S.rejected.push(x);save();closeModal();render()}});
  document.querySelectorAll('[data-redeem]').forEach(b=>b.onclick=()=>{let r=S.rewards.find(x=>x.id===b.dataset.redeem),p=current(),t=totals(p.id);if(p.type!==r.for||t.balance<r.cost)return;if(!confirm(`Riscattare "${r.name}"?`))return;S.redeems.push({id:uid(),rewardId:r.id,name:r.name,cost:r.cost,by:p.id,for:r.for,at:Date.now(),week:monday(Date.now())});logEvent(p.name+' ha riscattato: '+r.name);save();render();toast('Premio Riscattato!')});
  document.querySelector('#saveTeam')?.addEventListener('click',()=>{S.team.goal=Math.max(1,+document.querySelector('#teamGoal').value||1);S.team.prize=document.querySelector('#teamPrize').value.trim()||'Premio famiglia';save();render();toast('Obiettivo aggiornato')});
  document.querySelectorAll('[data-personedit]').forEach(b=>b.onclick=()=>personForm(b.dataset.personedit));
}

/* Modale con selezione Uomo / Donna */
function personForm(id){
  let p=id?person(id):{name:'',type:'adult',gender:'male',age:30},editing=!!id;
  openModal(`
    <h2>${editing?'Modifica':'Aggiungi'} Componente</h2>
    <label>Nome</label>
    <input id="personName" value="${esc(p.name)}" placeholder="Nome">
    
    <label>Ruolo</label>
    <select id="personType">
      <option value="adult" ${p.type==='adult'?'selected':''}>Adulto</option>
      <option value="child" ${p.type==='child'?'selected':''}>Figlio/a</option>
    </select>
    
    <label>Genere (personalizza colori)</label>
    <select id="personGender">
      <option value="male" ${p.gender==='male'?'selected':''}>Uomo / Ragazzo 👨</option>
      <option value="female" ${p.gender==='female'?'selected':''}>Donna / Ragazza 👩</option>
    </select>
    
    <label>Età</label>
    <input id="personAge" type="number" min="1" max="99" value="${p.age||8}">
    
    <div class="wrap" style="margin-top:18px">
      <button class="btn" id="savePerson" style="flex:1">Salva</button>
      <button class="btn ghost" onclick="closeModal()">Annulla</button>
      ${editing?`<button class="btn danger" id="deletePerson">Elimina</button>`:''}
    </div>
  `);
  
  document.querySelector('#savePerson').onclick=()=>{
    let name=document.querySelector('#personName').value.trim(),
        type=document.querySelector('#personType').value,
        gender=document.querySelector('#personGender').value,
        age=Math.max(1,+document.querySelector('#personAge').value||1);
    if(!name)return toast('Inserisci un nome');
    if(editing) Object.assign(p,{name,type,gender,age});
    else{ p={id:uid(),name,type,gender,age}; S.people.push(p); S.current=p.id; }
    save(); closeModal(); render();
  };
  
  document.querySelector('#deletePerson')?.addEventListener('click',()=>{
    if(S.people.length<=1)return toast('Serve almeno un componente');
    if(confirm('Eliminare profilo?')){ S.people=S.people.filter(x=>x.id!==id); if(S.current===id)S.current=S.people[0].id; save(); closeModal(); render(); }
  });
}

function taskForm(taskId){
  let task=S.tasks.find(x=>x.id===taskId),p=current(),others=S.people.filter(x=>x.id!==p.id);
  if(task.for!==p.type)return toast(task.for==='child'?'Seleziona profilo figlio.':'Seleziona profilo adulto.');
  if(!others.length)return toast('Aggiungi un altro componente per la verifica');
  openModal(`
    <h2>Segna Faccenda</h2>
    <p><b>${esc(task.name)}</b> • ${task.points} pt</p>
    <label>Chi deve verificare?</label>
    <select id="reviewer">${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>
    <button class="btn" id="sendTask" style="margin-top:16px;width:100%">Invia per conferma</button>
  `);
  document.querySelector('#sendTask').onclick=()=>{
    let reviewer=document.querySelector('#reviewer').value;
    S.pending.push({id:uid(),taskId:task.id,name:task.name,points:task.points,by:p.id,reviewer,at:Date.now(),week:monday(Date.now())});
    save(); closeModal(); render(); toast('Inviata per approvazione!');
  };
}

function decide(id,target,factor){
  let x=S.pending.find(y=>y.id===id);if(!x)return;
  if(x.reviewer!==S.current)return toast('Solo il verificatore designato può approvare');
  S.pending=S.pending.filter(y=>y.id!==id);
  if(target==='approved'){
    let pts=Math.round(x.points*factor);
    S.approved.push({...x,points:pts,approvedBy:S.current,approvedAt:Date.now()});
    logEvent(`${person(x.reviewer).name} ha approvato ${x.name} (${pts} pt)`);
  }
  save(); render();
}

S=load();
if(!S.team)S.team=defaults().team;
if(!S.settings)S.settings=defaults().settings;
if(!S.pending)S.pending=[];
if(!S.approved)S.approved=[];
if(!S.rejected)S.rejected=[];
if(!S.events)S.events=[];
if(!S.people?.length)S.people=defaults().people;
if(!S.current||!S.people.some(x=>x.id===S.current))S.current=S.people[0].id;
save(); render();
</script>
</body>
</html>

h1{text-align:center;margin:6px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--bd);font:600 13px Georgia,"Times New Roman",serif;letter-spacing:.38em;color:var(--mu)}
h2{font-size:14px;color:var(--mu);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
nav,.who{display:flex;gap:6px;margin-bottom:12px}.who{flex-wrap:wrap}
nav button,.who button{flex:1;padding:9px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.who button{flex:1 1 70px}.who button.plus{flex:0 0 44px}
nav button.on,.who button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.task{width:100%;text-align:left;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:12px;margin-bottom:6px;font:inherit;display:flex;justify-content:space-between;align-items:center}
.task:active{background:var(--ac2)}
.pt{background:var(--ac2);color:var(--act);border-radius:99px;padding:2px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}.big{font-size:30px;font-weight:700}
input{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;min-width:0}
.add{display:flex;gap:6px;margin-top:10px}.add input:first-child{flex:1}.add input.n{width:76px}
.ed{display:flex;gap:6px;margin-bottom:6px;align-items:center}.ed input{flex:1}.ed input.n{flex:none;width:68px}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:inherit;font-weight:600}
.btn.o{background:transparent;color:var(--act);border:1px solid var(--ac)}.btn:disabled{opacity:.45}
.x{border:0;background:none;color:var(--mu);font-size:18px;padding:4px 8px}
.bar{height:8px;border-radius:9px;background:var(--bar);margin-top:6px}
.tog{display:flex;gap:6px;margin-bottom:10px}.tog button{flex:1}
.win{border-color:var(--dough);background:var(--win)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<main><div class="logo" role="img" aria-label="W SERVICE"></div><h1>CLEANING GAME</h1><div id="app"></div></main>
<div id="toast"></div>
<script>
const KEY="faccende_v1";
const D=[["Cucina",[["Cucinare pranzo o cena",10],["Apparecchiare e sparecchiare",3],["Lavare i piatti",5],["Caricare la lavastoviglie",4],["Svuotare la lavastoviglie",4],["Pulire piano cottura e cucina",8],["Pulire il frigorifero",12],["Pulire il forno",15]]],
["Bucato",[["Lavatrice (avviare e stendere)",6],["Ritirare e piegare i panni",5],["Stirare",10],["Cambiare le lenzuola",8]]],
["Pulizie",[["Passare l’aspirapolvere",10],["Lavare i pavimenti",15],["Pulire il bagno",15],["Spolverare",8],["Pulire i vetri",12],["Fare i letti",2],["Riordinare",5],["Pulire il balcone",10]]],
["Altro",[["Fare la spesa",10],["Portare fuori la spazzatura",3],["Svuotare i cestini",2],["Annaffiare le piante",2]]]];
const DR=[["Scelgo io il film della serata",30],["Colazione a letto",40],["Massaggio di 20 minuti",50],["Giornata senza faccende",100],["Cena fuori scelta da me",150],["Regalo a sorpresa",300]];
const net=l=>l.points-(l.pen||0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S=null,tab="fai",per="week",edit=false;
const mkDef=()=>({players:[{id:"a",name:"Io"},{id:"b",name:"Partner"}],cur:"a",named:false,
  tasks:D.flatMap(([g,l])=>l.map(([n,p])=>({id:uid(),g,name:n,points:p}))),logs:[],
  rewards:DR.map(([n,c])=>({id:uid(),name:n,cost:c})),redeems:[],adj:[],weeks:[],closedUntil:0,seenWeek:0,
  rules:{bonus:20,malus:0,pen:50,win:"Scegli tu la cena del weekend 🍽️",lose:"Penitenza: lavi tu i piatti domenica 🧽"}});
function load(){const d=mkDef();try{const r=localStorage.getItem(KEY);if(r){const o=Object.assign(d,JSON.parse(r));o.rules=Object.assign(mkDef().rules,o.rules);d.rules=o.rules}}catch(e){}
  if(!d.named)d.players.forEach(p=>{if(p.name==="Io"||p.name==="Partner")p.name=""});return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s),on=(s,f)=>document.querySelectorAll(s).forEach(f),B=(s,f)=>{const e=$(s);if(e)e.onclick=f};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t,u){const e=$("#toast");e.textContent=t;if(u){const b=document.createElement("button");b.textContent="Annulla";b.style.cssText="margin-left:12px;border:0;background:none;color:var(--ac);font:inherit;font-weight:700";b.onclick=()=>{u();e.classList.remove("on")};e.appendChild(b)}e.classList.add("on");clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove("on"),u?5000:1800)}
const usedWeek=r=>{const ws=wsOf(Date.now());return S.redeems.some(x=>x.by===S.cur&&x.ts>=ws&&(x.rewardId?x.rewardId===r.id:x.name===r.name))};
const nm=id=>(S.players.find(p=>p.id===id)||{name:"?"}).name,nms=a=>a.map(nm).join(" e ");
const wsOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addWeek=t=>{const d=new Date(t);d.setDate(d.getDate()+7);return d.getTime()};
const fd=t=>new Date(t).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
function totals(){const ws=wsOf(Date.now()),t={};S.players.forEach(p=>t[p.id]={earned:0,week:0,spent:0});
  S.logs.forEach(l=>{if(!t[l.by])return;t[l.by].earned+=net(l);if(l.ts>=ws)t[l.by].week+=net(l)});
  S.adj.forEach(a=>{if(t[a.by])t[a.by].earned+=a.points});
  S.redeems.forEach(r=>{if(t[r.by])t[r.by].spent+=r.cost});return t}
function closeWeeks(){const ws=wsOf(Date.now());
  if(!S.closedUntil){const f=S.logs.reduce((m,l)=>Math.min(m,l.ts),ws+1);S.closedUntil=f>ws?ws:wsOf(f)}
  while(S.closedUntil<ws){const a=S.closedUntil,b=addWeek(a),pts={};S.players.forEach(p=>pts[p.id]=0);
    S.logs.forEach(l=>{if(l.ts>=a&&l.ts<b&&pts[l.by]!==undefined)pts[l.by]+=net(l)});
    const ids=Object.keys(pts),v=ids.map(i=>pts[i]);let w=[],lo=[];
    if(ids.length>1&&Math.max(...v)>0){const mx=Math.max(...v),mn=Math.min(...v);w=ids.filter(i=>pts[i]===mx);if(mn<mx)lo=ids.filter(i=>pts[i]===mn);
      w.forEach(i=>S.rules.bonus>0&&S.adj.push({id:uid(),by:i,points:S.rules.bonus,name:"🏆 Bonus settimana",ts:b-1}));
      lo.forEach(i=>S.rules.malus>0&&S.adj.push({id:uid(),by:i,points:-S.rules.malus,name:"🧽 Malus settimana",ts:b-1}));
      S.weeks.push({start:a,pts,w,lo})}
    S.closedUntil=b}
  save()}
function setup(){
  const cap=()=>document.querySelectorAll("[data-sn]").forEach(i=>{S.players.find(p=>p.id===i.dataset.sn).name=i.value.trim()});
  let h=`<div class="card"><b>Chi partecipa?</b><div class="mu" style="margin:4px 0 10px">Scrivi i nomi di chi gioca. Puoi aggiungerne quanti vuoi.</div>`;
  S.players.forEach(p=>{h+=`<div class="ed"><input data-sn="${p.id}" placeholder="Nome" value="${esc(p.name)}" maxlength="20"></div>`});
  h+=`<div class="add"><button class="btn o" id="sa">＋ Aggiungi</button><button class="btn" id="sg" style="margin-left:auto">Inizia</button></div></div>`;
  $("#app").innerHTML=h;
  B("#sa",()=>{cap();S.players.push({id:uid(),name:""});setup()});
  B("#sg",()=>{cap();const k=S.players.filter(p=>p.name);if(!k.length){toast("Inserisci almeno un nome");return}S.players=k;S.cur=k[0].id;S.named=true;save();render()});
}
function render(){
  if(!S.named){setup();return}
  closeWeeks();
  const T=totals(),m=T[S.cur]||{earned:0,week:0,spent:0},bal=m.earned-m.spent,R=S.rules;
  let h="<div class='who'>"+S.players.map(p=>`<button data-w="${p.id}" class="${S.cur===p.id?"on":""}">${esc(p.name)}</button>`).join("")+`<button class="plus" id="np" title="Aggiungi partecipante">＋</button></div>`;
  h+="<nav>"+[["fai","✅ Fai"],["class","🏆 Classifica"],["premi","🎁 Premi"],["storia","🕘 Storico"]].map(([k,l])=>`<button data-t="${k}" class="${tab===k?"on":""}">${l}</button>`).join("")+"</nav>";
  const lw=S.weeks[S.weeks.length-1];
  if(lw&&S.seenWeek!==lw.start)h+=`<div class="card win"><b>Settimana del ${fd(lw.start)} chiusa</b><div style="margin-top:6px">👑 ${esc(nms(lw.w))}: ${esc(R.win)}${R.bonus>0?` (+${R.bonus} punti)`:""}</div>${lw.lo.length?`<div style="margin-top:4px">🧽 ${esc(nms(lw.lo))}: ${esc(R.lose)}${R.malus>0?` (−${R.malus} punti)`:""}</div>`:""}<div class="add"><button class="btn" id="ok" style="margin-left:auto">OK</button></div></div>`;
  if(tab==="fai"){
    h+=`<div class="card row"><div><div class="mu">Punti disponibili di ${esc(nm(S.cur))}</div><div class="big">${bal}</div></div><div class="mu" style="text-align:right">Settimana: ${m.week}<br>Totale accumulato: ${m.earned}</div></div>`;
    h+=`<div class="row" style="margin:10px 0 0"><span class="mu">${edit?"Modifica nomi e punti":"Tocca per segnare"}</span><button class="btn ${edit?"":"o"}" id="ed">${edit?"✔ Fatto":"✏️ Modifica elenco"}</button></div>`;
    let g="";
    S.tasks.forEach(t=>{const gg=t.g||"Altro";if(gg!==g){g=gg;h+=`<h2>${esc(g)}</h2>`}
      h+=edit?`<div class="ed"><input data-tn="${t.id}" value="${esc(t.name)}"><input data-tpt="${t.id}" class="n" type="number" min="1" value="${t.points}"><button class="x" data-dt="${t.id}">🗑</button></div>`
      :`<button class="task" data-do="${t.id}"><span>${esc(t.name)}</span><span class="pt">+${t.points}</span></button>`});
    if(edit)h+=`<div class="card" style="margin-top:12px"><b>Nuova attività</b><div class="add"><input id="tn" placeholder="Es. Lavare l’auto"><input id="tp" class="n" type="number" min="1" value="5"><button class="btn" id="ta">＋</button></div></div>`;
  }
  if(tab==="class"){
    h+=`<div class="tog">${[["week","Settimana"],["all","Sempre"],["hist","Settimane"]].map(([k,l])=>`<button class="btn ${per===k?"":"o"}" data-p="${k}">${l}</button>`).join("")}</div>`;
    if(per==="hist"){
      if(!S.weeks.length)h+="<div class='mu'>Le settimane concluse compariranno qui, con vincitore e ultimo.</div>";
      S.weeks.slice().reverse().forEach(w=>{h+=`<div class="card"><b>Settimana del ${fd(w.start)}</b><div class="mu" style="margin:4px 0">${Object.keys(w.pts).filter(i=>S.players.some(p=>p.id===i)).sort((a,b)=>w.pts[b]-w.pts[a]).map(i=>esc(nm(i))+" "+w.pts[i]).join(" · ")}</div><div>👑 ${esc(nms(w.w))}${w.lo.length?` · 🧽 ${esc(nms(w.lo))}`:""}</div></div>`});
    }else{
      const k=per==="week"?"week":"earned",rows=S.players.map(p=>p.id).sort((x,y)=>T[y][k]-T[x][k]),mx=Math.max(1,...rows.map(i=>T[i][k])),mn=Math.min(...rows.map(i=>T[i][k]));
      rows.forEach(i=>{const v=T[i][k],top=rows.length>1&&v===mx&&v>0,low=rows.length>1&&v===mn&&mn<mx&&per==="week";
        h+=`<div class="card"><div class="row"><b>${top?"👑 ":""}${low?"🧽 ":""}${esc(nm(i))}</b><span class="pt">${v} pt</span></div><div class="bar" style="width:${Math.round(Math.max(v,0)/mx*100)}%"></div><div class="mu" style="margin-top:6px">Totale accumulato: ${T[i].earned} · Disponibili: ${T[i].earned-T[i].spent}</div></div>`});
      if(per==="week"&&S.players.length>1)h+=`<div class="card win"><b>In palio a fine settimana</b><div style="margin-top:6px">👑 Il migliore: ${esc(R.win)}${R.bonus>0?` (+${R.bonus} punti)`:""}</div><div style="margin-top:4px">🧽 L’ultimo: ${esc(R.lose)}${R.malus>0?` (−${R.malus} punti)`:""}</div><div class="mu" style="margin-top:6px">La settimana si chiude domenica a mezzanotte.</div></div>`;
    }
    h+=`<h2>Partecipanti</h2><div class="card">${S.players.map(p=>`<div class="ed"><input data-pn="${p.id}" value="${esc(p.name)}" maxlength="20">${S.players.length>1?`<button class="x" data-dp="${p.id}">🗑</button>`:""}</div>`).join("")}<div class="add"><input id="pnew" placeholder="Nuovo partecipante" maxlength="20"><button class="btn" id="pa">＋</button></div></div>
    <h2>Regole</h2><div class="card"><div class="mu">Penalità se il lavoro non è perfetto (% dei punti)</div><div class="ed"><input data-r="pen" class="n" type="number" min="0" max="100" value="${R.pen}"></div><div class="mu">Punti bonus al migliore</div><div class="ed"><input data-r="bonus" class="n" type="number" min="0" value="${R.bonus}"></div>
    <div class="mu">Premio del migliore</div><div class="ed"><input data-r="win" value="${esc(R.win)}"></div>
    <div class="mu">Punti tolti all’ultimo</div><div class="ed"><input data-r="malus" class="n" type="number" min="0" value="${R.malus}"></div>
    <div class="mu">Penitenza dell’ultimo</div><div class="ed"><input data-r="lose" value="${esc(R.lose)}"></div></div>`;
  }
  if(tab==="premi"){
    h+=`<div class="card row"><div class="mu">Disponibili: ${esc(nm(S.cur))}</div><div class="big">${bal}</div></div>`;
    h+=`<div class="row" style="margin:0 0 8px"><span class="mu">${edit?"Modifica nomi e costi":""}</span><button class="btn ${edit?"":"o"}" id="ed">${edit?"✔ Fatto":"✏️ Modifica premi"}</button></div>`;
    S.rewards.slice().sort((a,b)=>a.cost-b.cost).forEach(r=>{h+=edit?`<div class="ed"><input data-rnm="${r.id}" value="${esc(r.name)}"><input data-rco="${r.id}" class="n" type="number" min="1" value="${r.cost}"><button class="x" data-dr="${r.id}">🗑</button></div>`
      :`<div class="card row"><div>${esc(r.name)}<div><span class="pt">${r.cost} pt</span></div>${usedWeek(r)?`<div class="mu">Di nuovo disponibile da lunedì</div>`:""}</div><button class="btn" data-rd="${r.id}" ${bal<r.cost||usedWeek(r)?"disabled":""}>${usedWeek(r)?"Già preso":"Riscatta"}</button></div>`});
    if(edit)h+=`<div class="card"><b>Nuovo premio</b><div class="add"><input id="rn" placeholder="Es. Serata libera"><input id="rp" class="n" type="number" min="1" value="100"><button class="btn" id="ra">＋</button></div></div>`;
    const rr=S.redeems.slice().sort((a,b)=>b.ts-a.ts).slice(0,8);
    if(rr.length)h+="<h2>Riscattati</h2>"+rr.map(r=>`<div class="card row"><span>${esc(nm(r.by))}: ${esc(r.name)}</span><span><span class="mu">−${r.cost}</span><button class="btn o" data-dd="${r.id}" style="margin-left:8px;padding:6px 10px">Annulla</button></span></div>`).join("");
  }
  if(tab==="storia"){
    const ls=[...S.logs.map(l=>({...l,k:"l"})),...S.adj.map(a=>({...a,k:"a"}))].sort((a,b)=>b.ts-a.ts).slice(0,60);
    if(!ls.length)h+="<div class='mu'>Ancora niente.</div>";
    ls.forEach(l=>{const d=new Date(l.ts),v=net(l);h+=`<div class="card"><div class="row"><div>${esc(l.name)}<div class="mu">${esc(nm(l.by))} · ${d.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"})}${l.k==="l"?" "+d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):""}</div>${l.pen?`<div class="mu" style="color:var(--bad)">⚠ Non perfetto: −${l.pen} punti</div>`:""}</div><span class="pt">${v>0?"+":""}${v}</span></div>${l.k==="l"?`<div class="add" style="justify-content:flex-end"><button class="btn o" data-pn2="${l.id}" style="padding:6px 10px">${l.pen?"Togli penalità":"⚠ Non perfetto"}</button><button class="btn o" data-dl="${l.id}" style="padding:6px 10px">Annulla</button></div>`:""}</div>`});
  }
  $("#app").innerHTML=h;
  on("[data-w]",b=>b.onclick=()=>{S.cur=b.dataset.w;save();render()});
  B("#np",()=>{tab="class";per="week";edit=false;render();const e=$("#pnew");if(e){e.scrollIntoView({block:"center"});e.focus()}});
  B("#ok",()=>{S.seenWeek=lw.start;save();render()});
  on("[data-t]",b=>b.onclick=()=>{tab=b.dataset.t;edit=false;render()});
  on("[data-p]",b=>b.onclick=()=>{per=b.dataset.p;render()});
  on("[data-do]",b=>b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.do),id=uid();S.logs.push({id,taskId:t.id,name:t.name,points:t.points,by:S.cur,ts:Date.now()});save();render();toast("+"+t.points+" per "+nm(S.cur),()=>{S.logs=S.logs.filter(x=>x.id!==id);save();render()})});
  on("[data-dt]",b=>b.onclick=()=>{if(confirm("Eliminare l’attività?")){S.tasks=S.tasks.filter(x=>x.id!==b.dataset.dt);save();render()}});
  on("[data-dr]",b=>b.onclick=()=>{if(confirm("Eliminare il premio?")){S.rewards=S.rewards.filter(x=>x.id!==b.dataset.dr);save();render()}});
  on("[data-dl]",b=>b.onclick=()=>{if(confirm("Annullare questa voce?")){S.logs=S.logs.filter(x=>x.id!==b.dataset.dl);save();render()}});
  on("[data-pn2]",b=>b.onclick=()=>{const l=S.logs.find(x=>x.id===b.dataset.pn2);l.pen=l.pen?0:Math.max(1,Math.round(l.points*S.rules.pen/100));save();render()});
  on("[data-dd]",b=>b.onclick=()=>{if(confirm("Annullare il riscatto? I punti tornano disponibili.")){S.redeems=S.redeems.filter(x=>x.id!==b.dataset.dd);save();render()}});
  on("[data-rd]",b=>b.onclick=()=>{const r=S.rewards.find(x=>x.id===b.dataset.rd);if(usedWeek(r)){toast("Già riscattato questa settimana");return}if(confirm("Riscattare “"+r.name+"” per "+r.cost+" punti?")){const id=uid();S.redeems.push({id,rewardId:r.id,name:r.name,cost:r.cost,by:S.cur,ts:Date.now()});save();render();toast("Premio riscattato 🎉",()=>{S.redeems=S.redeems.filter(x=>x.id!==id);save();render()})}});
  on("[data-tn]",i=>i.onchange=()=>{const v=i.value.trim();if(v)S.tasks.find(x=>x.id===i.dataset.tn).name=v;save();render()});
  on("[data-tpt]",i=>i.onchange=()=>{const v=parseInt(i.value);if(v>0)S.tasks.find(x=>x.id===i.dataset.tpt).points=v;save();render()});
  on("[data-rnm]",i=>i.onchange=()=>{const v=i.value.trim();if(v)S.rewards.find(x=>x.id===i.dataset.rnm).name=v;save();render()});
  on("[data-rco]",i=>i.onchange=()=>{const v=parseInt(i.value);if(v>0)S.rewards.find(x=>x.id===i.dataset.rco).cost=v;save();render()});
  on("[data-pn]",i=>i.onchange=()=>{const v=i.value.trim();if(v)S.players.find(p=>p.id===i.dataset.pn).name=v;save();render()});
  on("[data-dp]",b=>b.onclick=()=>{if(confirm("Eliminare "+nm(b.dataset.dp)+"? I suoi punti non conteranno più.")){S.players=S.players.filter(p=>p.id!==b.dataset.dp);if(!S.players.some(p=>p.id===S.cur))S.cur=S.players[0].id;save();render()}});
  on("[data-r]",i=>i.onchange=()=>{const k=i.dataset.r;if(k==="bonus"||k==="malus"||k==="pen")S.rules[k]=Math.min(k==="pen"?100:100000,Math.max(0,parseInt(i.value)||0));else if(i.value.trim())S.rules[k]=i.value.trim();save();render()});
  B("#ed",()=>{edit=!edit;render()});
  B("#pa",()=>{const v=$("#pnew").value.trim();if(v){const id=uid();S.players.push({id,name:v});S.cur=id;save();render()}});
  B("#ta",()=>{const n=$("#tn").value.trim(),p=parseInt($("#tp").value);if(n&&p>0){S.tasks.push({id:uid(),g:"Altro",name:n,points:p});save();render()}});
  B("#ra",()=>{const n=$("#rn").value.trim(),p=parseInt($("#rp").value);if(n&&p>0){S.rewards.push({id:uid(),name:n,cost:p});save();render()}});
}
S=load();save();render();
</script>
</body>
</html>
